name: Deploy to Cloud Run

on:
  push:
    branches: [release]

env:
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
  GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
  CLOUD_SQL_DB_NAME: ${{ vars.CLOUD_SQL_DB_NAME }}
  CLOUD_SQL_DB_USER: ${{ vars.CLOUD_SQL_DB_USER }}
  CLOUD_RUN_SA: ${{ vars.CLOUD_RUN_SA }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}"
          docker build --platform=linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          DB_URL="jdbc:postgresql:///${{ env.CLOUD_SQL_DB_NAME }}?cloudSqlInstance=${{ env.CLOUD_SQL_INSTANCE }}&socketFactory=com.google.cloud.sql.postgres.SocketFactory"

          # Single --set-env-vars with gcloud's alternate delimiter (^@^) so
          # values may contain commas (e.g. "Jl. Contoh No. 1, Jakarta").
          ENV_VARS="DB_URL=$DB_URL"
          ENV_VARS="$ENV_VARS@DB_USERNAME=${{ env.CLOUD_SQL_DB_USER }}"
          ENV_VARS="$ENV_VARS@SPRING_PROFILES_ACTIVE=prod"
          ENV_VARS="$ENV_VARS@SEED_USERNAME=${{ vars.SEED_USERNAME }}"
          ENV_VARS="$ENV_VARS@SEED_NAME=${{ vars.SEED_NAME }}"
          ENV_VARS="$ENV_VARS@SEED_BUSINESS_NAME=${{ vars.SEED_BUSINESS_NAME }}"
          [ -n "${{ vars.SEED_BUSINESS_ADDRESS }}" ] && ENV_VARS="$ENV_VARS@SEED_BUSINESS_ADDRESS=${{ vars.SEED_BUSINESS_ADDRESS }}"
          [ -n "${{ vars.SEED_NMID }}" ]             && ENV_VARS="$ENV_VARS@SEED_NMID=${{ vars.SEED_NMID }}"

          gcloud run deploy "${{ env.GCP_SERVICE_NAME }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --service-account="${{ env.CLOUD_RUN_SA }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances="${{ env.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars="^@^$ENV_VARS" \
            --set-secrets="DB_PASSWORD=bejo-db-password:latest" \
            --set-secrets="JWT_SECRET=bejo-jwt-secret:latest" \
            --set-secrets="API_TOKEN=bejo-api-token:latest" \
            --set-secrets="FIREBASE_CREDENTIALS_BASE64=bejo-firebase-credentials:latest" \
            --set-secrets="SEED_PASSWORD=bejo-seed-password:latest" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --cpu-throttling \
            --allow-unauthenticated \
            --quiet

      - name: Print deployment URLs
        run: |
          echo "Cloud Run: $(gcloud run services describe "${{ env.GCP_SERVICE_NAME }}" --region="${{ env.GCP_REGION }}" --format="value(status.url)")"
          echo "Custom:    https://${{ env.CUSTOM_DOMAIN }}"
