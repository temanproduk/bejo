name: Deploy

# Where a push to `release` deploys is chosen by the DEPLOY_TARGET repository variable
# (Settings → Secrets and variables → Actions → Variables):
#
#   cloudrun  Cloud Run only            <- the default when the variable is unset
#   vm        the Docker Compose VM only (scripts/deploy-vm.sh)
#   both      both of them, in parallel
#
# Run it by hand from the Actions tab to pick a target for that one run, or to roll the VM
# back to its previous release.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy ("default" = the DEPLOY_TARGET variable, else cloudrun)
        type: choice
        options: [default, cloudrun, vm, both]
        default: default
      vm_rollback:
        description: Roll the VM back to its previous release instead of deploying (VM only)
        type: boolean
        default: false

jobs:
  # The tests are the gate: a failing suite blocks the deploy. Skipped for a VM rollback, which
  # must stay possible even when the suite is red (that is often exactly when you need it).
  test:
    name: Tests
    if: ${{ inputs.vm_rollback != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  plan:
    name: Choose target
    runs-on: ubuntu-latest
    outputs:
      cloud_run: ${{ steps.t.outputs.cloud_run }}
      vm: ${{ steps.t.outputs.vm }}
    steps:
      - id: t
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ROLLBACK: ${{ inputs.vm_rollback }}
          VAR_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          target="$INPUT_TARGET"
          if [ -z "$target" ] || [ "$target" = default ]; then target="${VAR_TARGET:-cloudrun}"; fi
          if [ "$INPUT_ROLLBACK" = true ]; then target=vm; fi
          case "$target" in
            cloudrun|vm|both) ;;
            *) echo "::error::DEPLOY_TARGET must be cloudrun, vm or both (got '$target')"; exit 1 ;;
          esac
          echo "Deploy target: $target"
          echo "cloud_run=$([ "$target" != vm ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "vm=$([ "$target" != cloudrun ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  cloud-run:
    name: Deploy to Cloud Run
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.cloud_run == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job ask GitHub for the OIDC token Workload Identity Federation exchanges
    # Everything below is forwarded to scripts/deploy-cloud-run.sh, which owns how the service
    # is configured (env vars, secret mounts, sizing). Unset optional variables arrive as empty
    # strings and are skipped there, so the app's built-in defaults apply. `--set-env-vars`
    # replaces the whole environment on each deploy: an override must be set here (as a GitHub
    # Actions variable) or it is reset by the next release.
    env:
      # Required
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
      ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
      INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      CLOUD_SQL_DB_NAME: ${{ vars.CLOUD_SQL_DB_NAME }}
      CLOUD_SQL_DB_USER: ${{ vars.CLOUD_SQL_DB_USER }}
      CLOUD_RUN_SA: ${{ vars.CLOUD_RUN_SA }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      # Cloud Run sizing
      CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
      CLOUD_RUN_MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES }}
      CLOUD_RUN_MEMORY: ${{ vars.CLOUD_RUN_MEMORY }}
      CLOUD_RUN_CPU: ${{ vars.CLOUD_RUN_CPU }}
      CLOUD_RUN_TIMEOUT: ${{ vars.CLOUD_RUN_TIMEOUT }}
      CLOUD_RUN_CPU_THROTTLING: ${{ vars.CLOUD_RUN_CPU_THROTTLING }}
      # Seed user / business
      SEED_USERNAME: ${{ vars.SEED_USERNAME }}
      SEED_NAME: ${{ vars.SEED_NAME }}
      SEED_EMAIL: ${{ vars.SEED_EMAIL }}
      SEED_BUSINESS_NAME: ${{ vars.SEED_BUSINESS_NAME }}
      SEED_BUSINESS_ADDRESS: ${{ vars.SEED_BUSINESS_ADDRESS }}
      SEED_NMID: ${{ vars.SEED_NMID }}
      SEED_MERCHANT_PAN: ${{ vars.SEED_MERCHANT_PAN }}
      # Ad-campaign audio (bucket defaults to <project>-ads, matching init-gcp.sh)
      ADS_GCS_BUCKET: ${{ vars.ADS_GCS_BUCKET }}
      ADS_SIGNED_URL_TTL_SECONDS: ${{ vars.ADS_SIGNED_URL_TTL_SECONDS }}
      ADS_MAX_AUDIO_BYTES: ${{ vars.ADS_MAX_AUDIO_BYTES }}
      ADS_MAX_AUDIO_SECONDS: ${{ vars.ADS_MAX_AUDIO_SECONDS }}
      # Set to false when the install has no bejo-ads-admin-token secret (default: true)
      MOUNT_ADS_ADMIN_TOKEN: ${{ vars.MOUNT_ADS_ADMIN_TOKEN }}
      # Voice-converter models for on-device voice cloning (bucket defaults to <project>-voice-models, matching init-gcp.sh)
      VOICE_MODELS_GCS_BUCKET: ${{ vars.VOICE_MODELS_GCS_BUCKET }}
      # "Say the sale" (Gemini on Vertex AI): model, location and the per-user cost limits. All optional; the app's defaults
      # (gemini-3.5-flash, global, 12 s, thinking LOW, 6 a minute, 100 a day) apply when unset. The project is GCP_PROJECT_ID above.
      VOICE_TRANSACTION_MODEL: ${{ vars.VOICE_TRANSACTION_MODEL }}
      VOICE_TRANSACTION_LOCATION: ${{ vars.VOICE_TRANSACTION_LOCATION }}
      # Must stay below CLOUD_RUN_TIMEOUT (default 45 s); raise that first
      VOICE_TRANSACTION_TIMEOUT_SECONDS: ${{ vars.VOICE_TRANSACTION_TIMEOUT_SECONDS }}
      # MINIMAL|LOW|MEDIUM|HIGH; NONE leaves the field out (a blank variable means "unset", so it cannot say that)
      VOICE_TRANSACTION_THINKING_LEVEL: ${{ vars.VOICE_TRANSACTION_THINKING_LEVEL }}
      VOICE_TRANSACTION_MAX_REQUESTS_PER_MINUTE: ${{ vars.VOICE_TRANSACTION_MAX_REQUESTS_PER_MINUTE }}
      VOICE_TRANSACTION_MAX_REQUESTS_PER_DAY: ${{ vars.VOICE_TRANSACTION_MAX_REQUESTS_PER_DAY }}
      # "Say the sale" while still talking (Gemini Live over a WebSocket). All optional; the app's defaults (gemini-3.8-live,
      # us-central1, a 40 s session, 40 sessions at once) apply when unset. The session length must stay below CLOUD_RUN_TIMEOUT.
      VOICE_LIVE_ENABLED: ${{ vars.VOICE_LIVE_ENABLED }}
      VOICE_LIVE_MODEL: ${{ vars.VOICE_LIVE_MODEL }}
      VOICE_LIVE_LOCATION: ${{ vars.VOICE_LIVE_LOCATION }}
      VOICE_LIVE_MAX_SESSION_SECONDS: ${{ vars.VOICE_LIVE_MAX_SESSION_SECONDS }}
      VOICE_LIVE_MAX_SESSIONS: ${{ vars.VOICE_LIVE_MAX_SESSIONS }}
      # Set to true once bejo-callback-secret exists in Secret Manager (default: false)
      MOUNT_CALLBACK_SECRET: ${{ vars.MOUNT_CALLBACK_SECRET }}
      # Firebase/FCM: by default the service sends as its own service account in FIREBASE_PROJECT_ID (default:
      # this GCP project) — no key. Set MOUNT_FIREBASE_CREDENTIALS=true to mount bejo-firebase-credentials instead.
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      MOUNT_FIREBASE_CREDENTIALS: ${{ vars.MOUNT_FIREBASE_CREDENTIALS }}
      # Outgoing email for password reset. The password is a Secret Manager secret (bejo-mail-password);
      # set MOUNT_MAIL_PASSWORD=true once it exists (default: false)
      MOUNT_MAIL_PASSWORD: ${{ vars.MOUNT_MAIL_PASSWORD }}
      MAIL_HOST: ${{ vars.MAIL_HOST }}
      MAIL_PORT: ${{ vars.MAIL_PORT }}
      MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
      MAIL_STARTTLS: ${{ vars.MAIL_STARTTLS }}
      MAIL_SSL: ${{ vars.MAIL_SSL }}
      # Admin dashboard: who may sign in (comma-separated emails; needs the MAIL_* settings above) and
      # the browser origin allowed to call /api/admin/** (default https://dashboard.bejo.temanproduk.com)
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ADMIN_DASHBOARD_ORIGINS: ${{ vars.ADMIN_DASHBOARD_ORIGINS }}
      # Optional app overrides
      JWT_EXPIRATION_MS: ${{ vars.JWT_EXPIRATION_MS }}
      CALLBACK_DEFAULT_USERNAME: ${{ vars.CALLBACK_DEFAULT_USERNAME }}
      CALLBACK_FALLBACK_TO_DEFAULT: ${{ vars.CALLBACK_FALLBACK_TO_DEFAULT }}
      BUSINESS_MAX_USERS: ${{ vars.BUSINESS_MAX_USERS }}
      BUSINESS_SIZES: ${{ vars.BUSINESS_SIZES }}
      BUSINESS_DEFAULT_SIZE: ${{ vars.BUSINESS_DEFAULT_SIZE }}
      BUSINESS_INDUSTRIES: ${{ vars.BUSINESS_INDUSTRIES }}
      BUSINESS_DEFAULT_INDUSTRY: ${{ vars.BUSINESS_DEFAULT_INDUSTRY }}
      LOGIN_MAX_FAILURES: ${{ vars.LOGIN_MAX_FAILURES }}
      LOGIN_LOCKOUT_MINUTES: ${{ vars.LOGIN_LOCKOUT_MINUTES }}
      MAX_REQUEST_BYTES: ${{ vars.MAX_REQUEST_BYTES }}
      DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
      JAVA_OPTS: ${{ vars.JAVA_OPTS }}
      PUSH_QUEUE_THREADS: ${{ vars.PUSH_QUEUE_THREADS }}
      PUSH_QUEUE_CAPACITY: ${{ vars.PUSH_QUEUE_CAPACITY }}
      REQUEST_LOG_BODY_ON_ERROR: ${{ vars.REQUEST_LOG_BODY_ON_ERROR }}
      REQUEST_LOG_MAX_BODY_LENGTH: ${{ vars.REQUEST_LOG_MAX_BODY_LENGTH }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keyless by default: GitHub's OIDC token is exchanged for short-lived credentials (set up by
      # scripts/init-gcp.sh). Required on organizations that forbid downloadable service-account keys.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Fallback for a project that still allows keys: the GCP_SA_KEY secret (init-gcp.sh --sa-key).
      - name: Authenticate to Google Cloud (service-account key)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Compute image reference
        id: image
        run: echo "image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$GCP_SERVICE_NAME:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The Dockerfile compiles the app itself (multi-stage Maven build), so the runner needs no JDK.
      # Layers are cached in the GitHub Actions cache: the Maven dependency layer is rebuilt only when
      # pom.xml changes, instead of re-downloading every dependency on every deploy. provenance: false
      # keeps the pushed image a plain single manifest, which is what Cloud Run expects.
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: bash scripts/deploy-cloud-run.sh "${{ steps.image.outputs.image }}"

      - name: Print deployment URLs
        run: |
          echo "Cloud Run: $(gcloud run services describe "$GCP_SERVICE_NAME" --region="$GCP_REGION" --format='value(status.url)')"
          echo "Custom:    https://$CUSTOM_DOMAIN"

  vm:
    name: Deploy to VM
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.vm == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two deploys racing on one VM would fight over the same containers.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
      VM_APP_DIR: ${{ vars.VM_APP_DIR }}
      DOMAIN: ${{ vars.VM_DOMAIN }}
      # Only the host key pinned in VM_KNOWN_HOSTS is accepted; a fresh runner has no history.
      VM_HOST_KEY_CHECKING: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::secret VM_SSH_KEY is not set"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::variable VM_KNOWN_HOSTS is not set (output of: ssh-keyscan -p <port> <host>)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "VM_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      # --keep-env: the app's secrets stay on the VM (in its .env) and never pass through
      # GitHub; this deploys code only. Change app config with a normal local deploy.
      - name: Deploy to the VM
        env:
          ROLLBACK: ${{ inputs.vm_rollback }}
        run: |
          if [ "$ROLLBACK" = true ]; then
            bash scripts/deploy-vm.sh --rollback
          else
            bash scripts/deploy-vm.sh --keep-env
          fi
