name: CI

# Runs the full test suite (unit + functional H2 + ArchUnit module rules + the
# commerce→core orphan-detection check + a Postgres migration test) on every push to main and every PR.
#
# deploy.yml calls this same workflow (workflow_call) as the gate in front of a release deploy,
# so a push to `release` is tested exactly once, there — it is deliberately not a push trigger
# here. The release image itself is built with -DskipTests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # MigrationPostgresTest boots the app against this real Postgres (Flyway + ddl-auto=validate);
    # every other test uses in-memory H2 and cannot see schema/migration drift. Same image the
    # production VM runs, pinned by digest.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bejo
          POSTGRES_USER: bejo
          POSTGRES_PASSWORD: bejo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bejo -d bejo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATION_TEST_DB_URL: jdbc:postgresql://localhost:5432/bejo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The wrapper pins the Maven version (.mvn/wrapper/maven-wrapper.properties).
      - name: Run tests
        run: ./mvnw -B test
