global:
  scrape_interval: 15s
  evaluation_interval: 15s

# /actuator/prometheus requires X-API-TOKEN (so it is not publicly reachable on
# Cloud Run). We send it here from a file mounted by docker-compose (the compose
# `prometheus_api_token` config, sourced from the API_TOKEN env). Requires
# Prometheus >= 2.50 for http_headers.
scrape_configs:
  - job_name: bejo
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-TOKEN:
        files:
          - /etc/prometheus/api_token
    static_configs:
      - targets: ["app:8080"]
