services:
  postgres:
    image: postgres:17-alpine
    container_name: bejo-postgres
    environment:
      POSTGRES_DB: bejo
      POSTGRES_USER: bejo
      POSTGRES_PASSWORD: bejo
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bejo -d bejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bejo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bejo
      DB_USERNAME: bejo
      DB_PASSWORD: bejo
      API_TOKEN: ${API_TOKEN:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-YmVqby1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWNoYW5nZWQtaW4tcHJvZHVjdGlvbi1taW4tMjU2Yml0cw==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_NAME: ${SEED_NAME:-Admin}
      SEED_EMAIL: ${SEED_EMAIL:-anton.rifco@gmail.com}
      SEED_BUSINESS_NAME: ${SEED_BUSINESS_NAME:-My Business}
      SEED_BUSINESS_ADDRESS: ${SEED_BUSINESS_ADDRESS:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SEED_MERCHANT_PAN: ${SEED_MERCHANT_PAN:-}
      # Local convenience (production leaves this off): route unknown-PAN callbacks to the seed account
      CALLBACK_FALLBACK_TO_DEFAULT: ${CALLBACK_FALLBACK_TO_DEFAULT:-true}
      CALLBACK_SECRET: ${CALLBACK_SECRET:-}
      TZ: Asia/Jakarta
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bejo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The API token is written to a file (from the same API_TOKEN env as the app) and
    # read by the scrape job's http_headers, so /actuator/prometheus stays token-protected.
    configs:
      - source: prometheus_api_token
        target: /etc/prometheus/api_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - app

configs:
  # Inline content, interpolated from the environment — kept in sync with the app's
  # API_TOKEN automatically; no secret is committed. (Plain scalar → no trailing newline.)
  prometheus_api_token:
    content: ${API_TOKEN:-change-me-in-production}

volumes:
  postgres_data:
  prometheus_data:
