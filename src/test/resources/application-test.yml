spring:
  datasource:
    # INIT pre-creates the per-module schemas on connect (entities are @Table(schema = core|commerce|ads)),
    # so Hibernate create-drop only manages the tables within them.
    url: jdbc:h2:mem:bejo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS core\;CREATE SCHEMA IF NOT EXISTS commerce\;CREATE SCHEMA IF NOT EXISTS ads
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  api-token: test-api-token
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW11c3QtYmUtMjU2LWJpdHMtbG9uZyE=
    expiration-ms: 86400000
  security:
    login:
      # Low so a test can reach the lockout in a few attempts (production default is 10)
      max-failures: 3
      lockout-minutes: 15
  seed:
    password: ""
  callback:
    default-username: cb_seed
  ads:
    admin-token: test-ads-admin-token
    signed-url-ttl-seconds: 86400
    max-audio-bytes: 2097152
    max-audio-seconds: 10
