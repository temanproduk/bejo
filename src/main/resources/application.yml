spring:
  main:
    lazy-initialization: true
  application:
    name: bejo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bejo}
    username: ${DB_USERNAME:bejo}
    password: ${DB_PASSWORD:bejo}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Max wait to acquire a connection from the pool (not query time). Kept below the
      # 15s Cloud Run request timeout so a starved pool fails fast with a clean 500,
      # rather than the request being severed mid-flight.
      connection-timeout: 10000
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Jakarta
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Honor X-Forwarded-* from the Cloud Run proxy so Spring sees the original HTTPS
  # scheme/host (required for correct HSTS emission and redirect URLs).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

app:
  api-token: ${API_TOKEN:change-me-in-production}
  jwt:
    # Base64-encoded secret, minimum 256 bits. Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET:YmVqby1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWNoYW5nZWQtaW4tcHJvZHVjdGlvbi1taW4tMjU2Yml0cw==}
    # Token TTL in milliseconds (default 7 days). Set to 0 to disable expiry.
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  seed:
    username: ${SEED_USERNAME:admin}
    password: ${SEED_PASSWORD:}
    name: ${SEED_NAME:Admin}
    business-name: ${SEED_BUSINESS_NAME:My Business}
    business-address: ${SEED_BUSINESS_ADDRESS:}
    nmid: ${SEED_NMID:}
    merchant-pan: ${SEED_MERCHANT_PAN:}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  business:
    # Max users per business, INCLUDING the super admin (default 10)
    max-users: ${BUSINESS_MAX_USERS:10}
    # Allowed business sizes + industries (comma-separated), validated at registration.
    # Configurable so the option lists can change without a code change. The default-*
    # value is applied when the client omits the field; it must be one of the list values.
    sizes: ${BUSINESS_SIZES:Mikro,Kecil,Menengah,Besar,Non-Profit}
    default-size: ${BUSINESS_DEFAULT_SIZE:Mikro}
    industries: "${BUSINESS_INDUSTRIES:Makanan & Minuman,Otomotif,Event & Hiburan,Alat Tulis/Kantor,Peralatan Rumah Tangga,Pakaian & Aksesoris,Kesehatan & Kecantikan,Layanan Keuangan,SPBU,Pendidikan,Asuransi}"
    default-industry: "${BUSINESS_DEFAULT_INDUSTRY:Makanan & Minuman}"
  callback:
    # Seed user whose business every (PoC) QRIS callback is attributed to. Defaults to the
    # seed username so callbacks land on the seeded business (avoids an admin/seed mismatch).
    default-username: ${CALLBACK_DEFAULT_USERNAME:${SEED_USERNAME:admin}}
  request-logging:
    # Log the request body on 4xx/5xx (secrets masked, capped). Toggle + cap here.
    log-body-on-error: ${REQUEST_LOG_BODY_ON_ERROR:true}
    max-body-length: ${REQUEST_LOG_MAX_BODY_LENGTH:2048}
  push:
    # In-memory FCM delivery queue: worker threads + bounded queue (CallerRunsPolicy back-pressure).
    queue:
      threads: ${PUSH_QUEUE_THREADS:4}
      capacity: ${PUSH_QUEUE_CAPACITY:1000}
  ads:
    # Cloud Storage bucket holding campaign audio (created + locked down by scripts/init-gcp.sh).
    gcs-bucket: ${ADS_GCS_BUCKET:}
    # Lifetime (seconds) of the signed download URL pushed to the device (default 24h; GCS max 7d).
    signed-url-ttl-seconds: ${ADS_SIGNED_URL_TTL_SECONDS:86400}
    # Max decoded audio size in bytes (default 2 MB) and duration in seconds (default 10).
    # Both are checked before the file is uploaded to storage.
    max-audio-bytes: ${ADS_MAX_AUDIO_BYTES:2097152}
    max-audio-seconds: ${ADS_MAX_AUDIO_SECONDS:10}
    # Dedicated secret gating the admin surface (X-ADS-ADMIN-TOKEN header). Blank = feature off.
    admin-token: ${ADS_ADMIN_TOKEN:}

logging:
  level:
    com.bejo: INFO
    org.hibernate.SQL: WARN
    # jaudiotagger (audio duration check) is very chatty at INFO — quiet it
    org.jaudiotagger: WARN
