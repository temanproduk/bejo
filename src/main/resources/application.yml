spring:
  main:
    lazy-initialization: true
  application:
    name: bejo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bejo}
    username: ${DB_USERNAME:bejo}
    password: ${DB_PASSWORD:bejo}
    hikari:
      # Per instance. The database's max_connections must cover pool size x max instances (Cloud Run
      # max-instances, default 2) plus the DB's own reserved connections: a db-f1-micro allows very few,
      # so lower this (or raise the tier) before raising max-instances.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # Max wait to acquire a connection from the pool (not query time). Kept below the
      # 15s Cloud Run request timeout so a starved pool fails fast with a clean 500,
      # rather than the request being severed mid-flight.
      connection-timeout: 10000
  # Flyway runs with its defaults. baseline-on-migrate used to be on, which silently adopts a
  # non-empty schema that has no history table — i.e. it would mask the app being pointed at the
  # wrong database. The deployed database already has its flyway_schema_history, so it isn't needed.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  threads:
    virtual:
      enabled: true
  # Outgoing email (password-reset codes). Unset = the feature is off and the endpoint answers 503.
  # Zoho Mail: smtp.zoho.com for FREE accounts, smtppro.zoho.com for PAID ones (the wrong one fails login with
  # "554 5.7.8 Access Restricted"; .eu/.in/.com.au/.jp for other data centres), 587 + STARTTLS (default) or
  # 465 + SSL (MAIL_PORT=465 MAIL_SSL=true MAIL_STARTTLS=false). The password is an application-specific
  # password when the Zoho account has two-factor authentication.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      # Bound how long a slow mail server can hold a request thread
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Jakarta
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Honor X-Forwarded-* from the Cloud Run proxy so Spring sees the original HTTPS
  # scheme/host (required for correct HSTS emission and redirect URLs).
  forward-headers-strategy: framework

management:
  health:
    mail:
      # The default indicator opens an SMTP connection on every health probe: slow, rate-limited by
      # the provider, and it would make /actuator/health (Cloud Run + uptime checks) flap with Zoho.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  api-token: ${API_TOKEN:change-me-in-production}
  jwt:
    # Base64-encoded secret, minimum 256 bits. Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET:YmVqby1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWNoYW5nZWQtaW4tcHJvZHVjdGlvbi1taW4tMjU2Yml0cw==}
    # Token TTL in milliseconds (default 7 days). Set to 0 to disable expiry.
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  seed:
    username: ${SEED_USERNAME:admin}
    password: ${SEED_PASSWORD:}
    name: ${SEED_NAME:Admin}
    email: ${SEED_EMAIL:anton.rifco@gmail.com}   # verified at creation, so the seed admin can log in
    business-name: ${SEED_BUSINESS_NAME:My Business}
    business-address: ${SEED_BUSINESS_ADDRESS:}
    merchant-pan: ${SEED_MERCHANT_PAN:}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    project-id: ${FIREBASE_PROJECT_ID:}
  mail:
    # From address; Zoho requires the authenticated mailbox or one of its aliases (default: the username)
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Bejo}
  email-verification:
    code-ttl-minutes: 15
    max-attempts: 5               # guesses per code
    resend-cooldown-seconds: 60   # minimum gap between codes for one user
    max-requests-per-hour: 5      # codes per user per hour
    response-floor-ms: 1500       # pad resend-verification so an ignored request is not visibly faster
  password-reset:
    code-ttl-minutes: 15
    max-attempts: 5               # guesses per code
    resend-cooldown-seconds: 60   # minimum gap between codes for one user
    max-requests-per-hour: 5      # codes per user per hour
    email-change-lockout-hours: 24   # no code is sent to an address changed this recently
    response-floor-ms: 1500       # pad forgot-password so an ignored request is not visibly faster
  business:
    # Max users per business, INCLUDING the super admin (default 10)
    max-users: ${BUSINESS_MAX_USERS:10}
    # Allowed business sizes + industries (comma-separated), validated at registration.
    # Configurable so the option lists can change without a code change. The default-*
    # value is applied when the client omits the field; it must be one of the list values.
    sizes: ${BUSINESS_SIZES:Mikro,Kecil,Menengah,Besar,Non-Profit}
    default-size: ${BUSINESS_DEFAULT_SIZE:Mikro}
    industries: "${BUSINESS_INDUSTRIES:Makanan & Minuman,Otomotif,Event & Hiburan,Alat Tulis/Kantor,Peralatan Rumah Tangga,Pakaian & Aksesoris,Kesehatan & Kecantikan,Layanan Keuangan,SPBU,Pendidikan,Asuransi}"
    default-industry: "${BUSINESS_DEFAULT_INDUSTRY:Makanan & Minuman}"
  callback:
    # Account (and so business) a callback is attributed to when it can't be routed by merchant
    # PAN. Only used when fallback-to-default is on. Defaults to the seed username.
    default-username: ${CALLBACK_DEFAULT_USERNAME:${SEED_USERNAME:admin}}
    # Off (strict): a callback whose merchantPan is missing or matches no business is rejected
    # (404) and logged, instead of being recorded against the default account and pushed to its
    # owner — which let any forged callback fabricate a payment. Turn on only if the provider
    # genuinely sends payloads without a registered merchantPan (the earlier "buggy payload").
    fallback-to-default: ${CALLBACK_FALLBACK_TO_DEFAULT:false}
    # Shared secret the provider must send as X-Callback-Secret. Blank = the callback is
    # unauthenticated (logged as a warning in prod). See CallbackSecretFilter.
    secret: ${CALLBACK_SECRET:}
  security:
    login:
      # Brute-force brake on /api/auth/login, per username. Deliberately lenient: only
      # consecutive failures count and any success resets them, so typos never lock anyone out.
      max-failures: ${LOGIN_MAX_FAILURES:10}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    # Hard ceiling on a request body (413 above it), enforced before the body is read. The largest
    # legitimate payloads are the base64 business picture (<= 1 MB decoded) and ad audio (<= 2 MB
    # decoded, ~2.8 MB encoded); QRIS travels as a short code now, so there is generous headroom.
    # Lower it if you want a tighter ceiling.
    max-request-bytes: ${MAX_REQUEST_BYTES:8388608}
  request-logging:
    # Log the request body on 4xx/5xx (secrets masked, capped). Toggle + cap here.
    log-body-on-error: ${REQUEST_LOG_BODY_ON_ERROR:true}
    max-body-length: ${REQUEST_LOG_MAX_BODY_LENGTH:2048}
  push:
    # In-memory FCM delivery queue: worker threads + bounded queue (CallerRunsPolicy back-pressure).
    queue:
      threads: ${PUSH_QUEUE_THREADS:4}
      capacity: ${PUSH_QUEUE_CAPACITY:1000}
  admin:
    # The admin dashboard (a static site calling /api/admin/**). Whoever is listed here can sign in with
    # a one-time code emailed to them; comma-separated. Empty = nobody can sign in. Needs MAIL_* set.
    emails: ${ADMIN_EMAILS:}
    # Browser origins allowed to call /api/admin/** (CORS), comma-separated.
    dashboard-origins: ${ADMIN_DASHBOARD_ORIGINS:https://dashboard.bejo.temanproduk.com}
    session-ttl-hours: 12
    otp:
      code-ttl-minutes: 10
      max-attempts: 5               # guesses per code
      resend-cooldown-seconds: 60   # minimum gap between codes for one address
      max-requests-per-hour: 5      # codes per address per hour
      response-floor-ms: 1500       # pad otp/request so a non-admin address is not visibly faster
  voice:
    # "Say the amount": a short voice clip → Google Cloud Speech-to-Text → a rupiah amount (see docs/architecture/voice.md).
    # The Speech-to-Text API must be enabled on the GCP project; the service calls it as its own service account.
    speech-url: ${VOICE_SPEECH_URL:https://speech.googleapis.com/v1/speech:recognize}
    model: ${VOICE_MODEL:latest_short}
    # The longest clip accepted, and how long to wait for Google before giving up.
    max-seconds: ${VOICE_MAX_SECONDS:10}
    timeout-seconds: ${VOICE_TIMEOUT_SECONDS:10}
    # Below this recogniser confidence (0-1) the words are shown but no amount is offered: a wrong amount that looks
    # right is worse than none. Clean speech scored ~0.92 and speech over loud noise ~0.62 in testing; 0 = not reported.
    min-confidence: ${VOICE_MIN_CONFIDENCE:0.5}
    # Each call is billed, so a user may make only this many in any rolling minute.
    max-requests-per-minute: ${VOICE_MAX_REQUESTS_PER_MINUTE:12}
    # The voice-converter model files for "Suara Kamu Sendiri" (on-device cloning): a private bucket, handed to the app as
    # short-lived signed URLs (see docs/architecture/voice.md). Blank bucket = the endpoint answers 503. Each call mints links to
    # ~131 MB of downloads, so a user may make only this many in any rolling hour (this caps issued links, not downloaded bytes).
    models:
      gcs-bucket: ${VOICE_MODELS_GCS_BUCKET:}
      signed-url-ttl-seconds: ${VOICE_MODELS_SIGNED_URL_TTL_SECONDS:3600}
      max-requests-per-hour: ${VOICE_MODELS_MAX_REQUESTS_PER_HOUR:10}
    # "Say the sale" (POST /api/voice/transaction): a spoken sentence → Gemini on Vertex AI → a structured manual transaction
    # (see docs/architecture/voice.md). The Vertex AI API (aiplatform.googleapis.com) must be enabled on the GCP project and the
    # service account needs roles/aiplatform.user; both are done by scripts/init-gcp.sh. Gemini 2.5 Flash retires 2026-10-20,
    # so the default is a 3.x Flash model; whether it accepts audio and structured output at the chosen location is checked
    # with scripts/smoke-voice-transaction.sh.
    transaction:
      model: ${VOICE_TRANSACTION_MODEL:gemini-3.5-flash}
      location: ${VOICE_TRANSACTION_LOCATION:global}
      # The project that hosts the model; blank = the project the credentials are billed to (the ADC quota project)
      project-id: ${GCP_PROJECT_ID:}
      # How long to wait for Gemini. It must stay BELOW the platform's request timeout (Cloud Run: CLOUD_RUN_TIMEOUT, default 15 s,
      # in seconds) so the call gives up and answers 503 before the platform cuts the request; raise CLOUD_RUN_TIMEOUT first.
      timeout-seconds: ${VOICE_TRANSACTION_TIMEOUT_SECONDS:12}
      # generationConfig.thinkingConfig.thinkingLevel: MINIMAL, LOW, MEDIUM or HIGH (Gemini 3 thinks by default, which is slow).
      # Blank (or NONE) = leave the field out, the fallback if a model rejects it with a 400; anything else falls back to LOW.
      # Not combined with a thinking budget, ever. Unverified against the live API.
      thinking-level: ${VOICE_TRANSACTION_THINKING_LEVEL:LOW}
      # Output budget; a 20-item answer is ~900 tokens, and a thinking model spends part of this on its reasoning
      max-output-tokens: ${VOICE_TRANSACTION_MAX_OUTPUT_TOKENS:2048}
      # Recording length: at least 0.5 s, at most this
      max-seconds: ${VOICE_TRANSACTION_MAX_SECONDS:30}
      # Every call is billed: at most this many per user in any rolling minute / rolling 24 hours
      max-requests-per-minute: ${VOICE_TRANSACTION_MAX_REQUESTS_PER_MINUTE:6}
      max-requests-per-day: ${VOICE_TRANSACTION_MAX_REQUESTS_PER_DAY:100}
      # An amount or price above this is dropped as a mishearing (the form allows far more, the database any positive BIGINT)
      max-amount: ${VOICE_TRANSACTION_MAX_AMOUNT:999999999}
  ads:
    # Cloud Storage bucket holding campaign audio (created + locked down by scripts/init-gcp.sh).
    gcs-bucket: ${ADS_GCS_BUCKET:}
    # Lifetime (seconds) of the signed download URL pushed to the device (default 24h; GCS max 7d).
    signed-url-ttl-seconds: ${ADS_SIGNED_URL_TTL_SECONDS:86400}
    # Max decoded audio size in bytes (default 2 MB) and duration in seconds (default 10).
    # Both are checked before the file is uploaded to storage.
    max-audio-bytes: ${ADS_MAX_AUDIO_BYTES:2097152}
    max-audio-seconds: ${ADS_MAX_AUDIO_SECONDS:10}
    # Dedicated secret gating the admin surface (X-ADS-ADMIN-TOKEN header). Blank = feature off.
    admin-token: ${ADS_ADMIN_TOKEN:}

logging:
  level:
    com.bejo: INFO
    org.hibernate.SQL: WARN
    # jaudiotagger (audio duration check) is very chatty at INFO — quiet it
    org.jaudiotagger: WARN
